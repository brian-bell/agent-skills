name: catalog

on:
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    name: Generator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test catalog generation
        run: python3 -m unittest scripts.test_generate_skills_catalog

  pinned-cli:
    name: Pinned CLI install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test pinned CLI discovery and isolated install
        run: scripts/test-skills-catalog-cli.sh
