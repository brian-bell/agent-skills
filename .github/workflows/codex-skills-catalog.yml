name: Codex skills catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-behavior:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test catalog generator behavior
        run: python3 -m unittest scripts.test_generate_skills_catalog

  generated-catalog-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated catalog drift
        run: python3 scripts/generate-skills-catalog.py --check

  pinned-codex-install:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install every package with pinned skills CLI
        run: scripts/test-skills-catalog-cli.sh

  canonical-remote-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install canonical remote catalog with pinned CLI
        env:
          CATALOG_SOURCE: https://github.com/brian-bell/agent-skills/tree/main/catalog
          SKILLS_CLI_VERSION: 1.5.21
        run: scripts/test-skills-catalog-remote.sh

  latest-cli-compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install canonical remote catalog with latest CLI
        env:
          CATALOG_SOURCE: https://github.com/brian-bell/agent-skills/tree/main/catalog
          SKILLS_CLI_VERSION: latest
        run: scripts/test-skills-catalog-remote.sh
